<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Gestión de Ofertas - Administrador</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body class="pagina-interna">
    <nav class="navbar">
        <div class="logo">
            <a href="index.html">J<span class="mira-logo">⌖</span>bHunter</a>
        </div>
        <a href="mis_postulaciones.html">Postulaciones Activas</a> |
        <a href="estadisticas.html">Estadísticas</a> |
        <a href="login.html">Cerrar Sesión</a>
    </nav>

    <div class="contenedor">
        <h1>Gestión de ofertas laborales</h1>

        <div class="card">
            <h3>Crear nueva oferta</h3>

            <div class="form-grupo">
                <label>Título de la oferta:</label>
                <input type="text" id="txtTituloOferta">
            </div>

            <div class="form-grupo">
                <label>Nombre de la empresa:</label>
                <input type="text" id="txtEmpresaOferta">
            </div>

            <div class="form-grupo">
                <label>Descripción de la oferta:</label>
                <textarea id="txtDescripcionOferta"></textarea>
            </div>

            <div class="form-grupo">
                <label>Nivel requerido:</label>
                <select id="slcNivelOferta">
                    <option>Junior</option>
                    <option>Semi-Senior</option>
                    <option>Senior</option>
                </select>
            </div>

            <div class="form-grupo">
                <label>Área:</label>
                <select id="slcAreaOferta">
                    <option>Tecnología</option>
                    <option>Diseño</option>
                    <option>Marketing</option>
                    <option>Administración</option>
                    <option>Otros</option>
                </select>
            </div>

            <div class="form-grupo">
                <label>Límite de postulaciones:</label>
                <input type="number" id="txtLimitePostulaciones">
            </div>

            <div class="form-grupo">
                <label>Cantidad de vacantes:</label>
                <input type="number" id="txtCantidadVacantes">
            </div>

            <div class="form-grupo">
                <label>
                    <input type="checkbox" id="chkOfertaDestacada"> Oferta destacada
                </label>
            </div>

            <button type="button" id="btnCrearOferta" class="boton">Crear oferta</button>

            <p id="pMensajeOferta" class="mt-2"></p>
        </div>
        <div class="buscador-container" style="margin-bottom: 20px;">
            <input type="text" id="buscadorOfertas" onkeyup="filtrarTabla()"
                placeholder="Buscar por puesto o empresa..."
                style="width: 100%; padding: 10px; border: 1px solid #D0D0D0; border-radius: 4px;">
        </div>
        <table class="tabla">
    <thead>
        <tr>
            <th>Puesto</th>
            <th>Empresa</th>
            <th>Vacantes</th>
            <th>Pendientes</th>
            <th>Rechazadas</th>
            <th>Aceptadas</th>
            <th>Total</th>
            <th>Acción</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>Pasante Backend</td>
            <td>Sabre</td>
            <td><strong>3</strong></td>
            <td><span class="badge pendiente">5</span></td>
            <td><span class="badge rechazada">2</span></td>
            <td><span class="badge aceptada">0</span></td>
            <td><span class="badge total">7</span></td>
            <td><button class="boton boton-pequeno">Ver Detalles</button></td>
        </tr>
    </tbody>
</table>
        <script src="js/ofertas.js"></script>
</body>

</html>
