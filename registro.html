<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobHunter - Registro</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body class="pagina-interna">

<header>
    <nav class="navbar">
        <div class="logo">
            <a href="index.html">J<span class="mira-logo">⌖</span>bHunter</a>
        </div>
        
        <ul class="nav-links">
            <li><a href="login.html">Iniciar Sesión</a></li>
            <li><a href="registro.html">Crear Cuenta</a></li>
            <li><a href="ofertas.html">Caza de Trabajo</a></li>
        </ul>
    </nav>
</header>

    <div class="contenedor">
        <div class="cabecera-seccion text-center">
            <h1>Únete a la Caza</h1>
            <p class="subtitulo">Crea tu cuenta de postulante y da el primer paso.</p>
        </div>

        <div class="card form-card">
            <h2 class="text-center">Crear cuenta</h2>
            
            <form id="formRegistro">
                <div class="campo">
                    <label for="txtNombreCompleto">Nombre Completo</label>
                    <input type="text" id="txtNombreCompleto" placeholder="Ej: Juan Pérez">
                </div>

                <div class="campo">
                    <label for="txtUsuario">Nombre de Usuario</label>
                    <input type="text" id="txtUsuario" placeholder="usuario123">
                    <small class="ayuda-input">Mínimo 5 caracteres</small>
                </div>

                <div class="campo">
                    <label for="txtPassword">Contraseña</label>
                    <input type="password" id="txtPassword" placeholder="********">
                    <small class="ayuda-input">Debe incluir Mayúscula, minúscula y número</small>
                </div>

                <div class="campo flex-row">
                    <div class="mitad">
                        <label for="slcNivel">Nivel de Experiencia</label>
                        <select id="slcNivel">
                            <option value="" disabled selected>Selecciona nivel...</option>
                            <option value="Junior">Junior</option>
                            <option value="Semi-Senior">Semi-Senior</option>
                            <option value="Senior">Senior</option>
                        </select>
                    </div>
                    
                    <div class="mitad">
                        <label for="slcArea">Área de Interés</label>
                        <select id="slcArea">
                            <option value="" disabled selected>Selecciona área...</option>
                            <option value="Tecnología">Tecnología</option>
                            <option value="Diseño">Diseño</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Administración">Administración</option>
                            <option value="Otros">Otros</option>
                        </select>
                    </div>
                </div>

                <button type="button" id="btnRegistrar" class="btn-principal mt-3">Registrarme</button>
            </form>

            <p id="pMensajeRegistro" class="mensaje-feedback"></p>
            
            <hr class="separador">
            <p class="text-center">¿Ya tienes cuenta? <a href="login.html" class="link-destacado">Inicia sesión aquí</a></p>
        </div>
    </div>

    <script src="js/datos.js"></script>
    <script src="js/registro.js"></script>
</body>
</html>
