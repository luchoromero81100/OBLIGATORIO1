<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Cartelera Laboral</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body class="pagina-login">
    <div class="card card-login">
        <h1 class="texto-centrado">Registro de Postulante</h1>
        
        <div class="form-grupo">
            <label>Usuario:</label>
            <input type="text" id="txtUserReg" class="form-control">
        </div>
        
        <div class="form-grupo">
            <label>Contraseña:</label>
            <input type="password" id="txtPassReg" class="form-control">
        </div>
        
        <div class="form-grupo">
            <label>Nombre completo:</label>
            <input type="text" id="txtNameReg" class="form-control">
        </div>
        
        <div class="form-grupo">
            <label>Nivel de experiencia:</label>
            <select id="selExperiencia" class="form-control">
                <option value="Junior">Junior</option>
                <option value="Semi-Senior">Semi-Senior</option>
                <option value="Senior">Senior</option>
            </select>
        </div>
        
        <div class="form-grupo">
            <label>Área de interés:</label>
            <select id="selArea" class="form-control">
                <option value="Tecnologia">Tecnología</option>
                <option value="Diseño">Diseño</option>
                <option value="Marketing">Marketing</option>
                <option value="Administracion">Administración</option>
                <option value="Otros">Otros</option>
            </select>
        </div>
        
        <button id="btnRegister" class="boton" style="width: 100%;">Registrarse</button>
        
        <p class="texto-centrado mt-3"><a href="login.html">Volver al login</a></p>
    </div>
</body>
</html>
